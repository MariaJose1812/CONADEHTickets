<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="icon" type="image/png" href="../Background_Images/iconoIT.png">
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="../responsive.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <title>Bienvenido al Sistema Tickets</title>
  </head>
  <body>
    <nav class="top-navbar">
      <div class="navbar-content">
        <img src="../Background_Images/infotec.jpg" class="navbar-logo" />

        <div class="navbar-title">
          <span>Sistema Tickets - Unidad IT</span>
        </div>

        <button class="logout-btn" type="button" onclick="cerrarSesion()">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </nav>
    <div class="tickets-container">
      <h2><i class="fa-solid fa-ticket"></i> Tickets Registrados</h2>

      <div class="layout">
        <!-- Columnas Izquierda -->

        <aside class="sidebar">
          <div
            class="status-card historial"
            id="btn-historial"
            role="button"
            tabindex="0"
          >
            <div class="status-title">Historial de Cambios</div>
            <div class="status-count">🔃</div>
          </div>

          <div class="status-card" data-estado="Abierto" id="card-abierto">
            <div class="status-title">Abiertos</div>
            <div class="status-count" id="count-abierto">0</div>
          </div>

          <div class="status-card" data-estado="En Proceso" id="card-proceso">
            <div class="status-title">En proceso</div>
            <div class="status-count" id="count-proceso">0</div>
          </div>

          <div class="status-card" data-estado="Terminado" id="card-terminado">
            <div class="status-title">Terminados</div>
            <div class="status-count" id="count-terminado">0</div>
          </div>

          <button class="btn-clear-filter" type="button" id="btn-ver-todos">
            Ver todos los tickets
          </button>
        </aside>

        <!-- Columna derecha -->
        <section class="content">
          <input
            type="text"
            id="search-ticket"
            placeholder="Buscar tickets..."
          />
          <div id="tickets-container">
            <!-- Los tickets se cargarán aquí dinámicamente -->
          </div>
        </section>
      </div>
    </div>

    <!-- Tarjeta Detalles -->
    <div
      class="modal"
      id="modalDetalles"
      name="modalDetalles"
      aria-hidden="true"
    >
      <div class="modal__overlay" id="modalOverlay"></div>

      <div
        class="modal__card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="modal__header">
          <h3 class="modal__title" id="modalTitle">Detalles del Ticket</h3>
          <button
            class="modal__close"
            id="modalClose"
            type="button"
            aria-label="Cerrar"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="modal__body">
          <div class="modal__row">
            <div class="modal__label">Ticket</div>
            <div class="modal__value" id="d-id">—</div>
          </div>

          <div class="modal__row">
            <div class="modal__label">Nombre</div>
            <div class="modal__value" id="d-nombre">—</div>
          </div>

          <div class="modal__row">
            <div class="modal__label">Estado</div>
            <div class="modal__value">
              <span class="pill" id="d-estado">—</span>
            </div>
          </div>

          <div class="modal__row">
            <div class="modal__label">Fecha y hora</div>
            <div class="modal__value" id="d-fecha">—</div>
          </div>

          <div class="modal__row modal__row--full">
            <div class="modal__label">Descripción</div>
            <div class="modal__value modal__desc" id="d-desc">—</div>
          </div>
        </div>

        <div class="modal__footer">
          <button class="modal__btn" id="modalOk" type="button">Cerrar</button>
        </div>
      </div>
    </div>

    <div id="historialOverlay" class="historial-overlay"></div>

    <aside id="historialPanel" class="historial-panel" aria-hidden="true">
      <div class="historial-header">
        <h3 class="historial-title">Historial de cambios</h3>
        <button
          id="historialClose"
          type="button"
          class="historial-close"
          aria-label="Cerrar"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="historialList" class="historial-body">
        <p class="historial-loading">Cargando historial…</p>
      </div>
    </aside>

    <script src="dashboard.js"></script>
  </body>

  <footer>
    <p>© 2026 | CONADEH</p>
  </footer>
</html>
